name: Repair preorder fix runner

on:
  push:
    branches: [dev-rebuild]
    paths:
      - .github/workflows/fix-admin-preorder-flow-helper.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - name: Repair and trigger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/fix-admin-preorder-flow.yml')
          text=path.read_text()
          old='''          if link_count != 2:\n              raise SystemExit(f"converted order labels: expected 2 matches, found {link_count}")'''
          new='''          if link_count != 1:\n              raise SystemExit(f"converted order labels: expected 1 match, found {link_count}")'''
          if text.count(old) != 1:
              raise SystemExit(f'expected repair target once, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          rm -f .github/workflows/fix-admin-preorder-flow-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair preorder fix runner"
          git push origin HEAD:dev-rebuild
