name: Apply public number runtime

on:
  push:
    branches: [dev-rebuild]
    paths:
      - .github/workflows/apply-public-number-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply tested runtime changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing expected pattern in {path}: {old[:100]!r}")
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text)

          # Map stable public numbers while keeping technical IDs unchanged.
          replace('server/api-implementation/_data/mappers.ts',
              '    id: text(row.id),\n    slug: text(row.slug),',
              '    id: text(row.id),\n    productNumber: number(row.product_number),\n    slug: text(row.slug),', 1)
          replace('server/api-implementation/_data/mappers.ts',
              '    orderId: text(row.order_id),\n    createdAt:',
              '    orderId: text(row.order_id),\n    orderNumber: number(row.order_number),\n    createdAt:', 1)

          replace('src/types/index.ts',
              'export type Product = {\n  id: string;\n  slug: string;',
              'export type Product = {\n  id: string;\n  productNumber?: number;\n  slug: string;')
          replace('src/types/index.ts',
              'export type ProductSummary = Pick<Product,"id"|"slug"',
              'export type ProductSummary = Pick<Product,"id"|"productNumber"|"slug"')
          replace('src/types/index.ts',
              '  kind: "order";\n  orderId: string;\n  createdAt:',
              '  kind: "order";\n  orderId: string;\n  orderNumber?: number;\n  createdAt:')
          replace('src/types/index.ts',
              'export type Order = {\n  orderId: string;\n  fulfillmentMethod?:',
              'export type Order = {\n  orderId: string;\n  orderNumber?: number;\n  fulfillmentMethod?:')
          replace('src/types/index.ts',
              'export type CustomerOrder = {\n  orderId: string;\n  createdAt:',
              'export type CustomerOrder = {\n  orderId: string;\n  orderNumber?: number;\n  createdAt:')

          # Return public order numbers in signed-in account history.
          replace('server/api-implementation/account/[action].ts',
              '        orderId?: unknown;\n        createdAt?: unknown;',
              '        orderId?: unknown;\n        orderNumber?: unknown;\n        createdAt?: unknown;')
          replace('server/api-implementation/account/[action].ts',
              '        orderId: String(order.orderId || ""),\n        createdAt:',
              '        orderId: String(order.orderId || ""),\n        orderNumber: Number(order.orderNumber) || 0,\n        createdAt:')

          # Guest tracking accepts the simple order number but still requires the matching phone.
          replace('server/api-implementation/order-track.ts',
              'import { findGuestOrder } from "./_data/orders.js";',
              'import { findGuestOrder } from "./_data/orders.js";\nimport { query } from "./_db.js";')
          replace('server/api-implementation/order-track.ts',
              'type FindOrder = (orderId: string, phone: string) => Promise<Record<string, unknown> | null>;',
              'type FindOrder = (orderId: string, phone: string) => Promise<Record<string, unknown> | null>;\ntype ResolveOrderNumber = (orderNumber: number) => Promise<string | null>;')
          replace('server/api-implementation/order-track.ts',
              '    orderId: text(row.order_id ?? row.orderId),\n    createdAt:',
              '    orderId: text(row.order_id ?? row.orderId),\n    orderNumber: number(row.order_number ?? row.orderNumber),\n    createdAt:')
          replace('server/api-implementation/order-track.ts',
              'export function createOrderTrackHandler(findOrder: FindOrder = findGuestOrder,findPreorder:FindOrder=findGuestPreorder) {',
              '''export function createOrderTrackHandler(\n  findOrder: FindOrder = findGuestOrder,\n  findPreorder: FindOrder = findGuestPreorder,\n  resolveOrderNumber: ResolveOrderNumber = async (orderNumber) => {\n    const resolved=(await query<{order_id:string}>("SELECT order_id FROM orders WHERE order_number=$1 LIMIT 1",[orderNumber])).rows[0];\n    return resolved?.order_id || null;\n  },\n) {''')
          replace('server/api-implementation/order-track.ts',
              '      if (!/^(ZEV|PRE)-[A-Z0-9-]+$/.test(orderId) || !/^947\\d{8}$/.test(phone))',
              '      if (!(/^\\d+$/.test(orderId) || /^(ZEV|PRE)-[A-Z0-9-]+$/.test(orderId)) || !/^947\\d{8}$/.test(phone))')
          replace('server/api-implementation/order-track.ts',
              '      const preorder=orderId.startsWith("PRE-"),row=await (preorder?findPreorder:findOrder)(orderId, phone);',
              '''      const preorder=orderId.startsWith("PRE-");\n      let lookupId=orderId;\n      if (!preorder && /^\\d+$/.test(orderId)) {\n        const resolved=await resolveOrderNumber(Number(orderId));\n        if (!resolved) return json(res,{error:notFound},404);\n        lookupId=resolved;\n      }\n      const row=await (preorder?findPreorder:findOrder)(lookupId, phone);''')

          # Show/copy/share the friendly number on customer surfaces; internal IDs remain for relationships/actions.
          replace('src/pages/OrderPage.tsx',
              '  const confirmedOrder = order,\n    whatsapp =',
              '  const confirmedOrder = order,\n    displayOrderId = String(order.orderNumber || order.orderId),\n    whatsapp =')
          replace('src/pages/OrderPage.tsx',
              'message = `Hello ZEVENRA, I have submitted order ${order.orderId}.',
              'message = `Hello ZEVENRA, I have submitted order ${displayOrderId}.')
          replace('src/pages/OrderPage.tsx',
              'await navigator.clipboard.writeText(confirmedOrder.orderId);',
              'await navigator.clipboard.writeText(displayOrderId);')
          replace('src/pages/OrderPage.tsx',
              '<Seo title={`Order ${order.orderId}`} noindex />',
              '<Seo title={`Order ${displayOrderId}`} noindex />')
          replace('src/pages/OrderPage.tsx', '#{order.orderId}', '#{displayOrderId}')
          replace('src/pages/OrderPage.tsx',
              'to={`/track-order?orderId=${encodeURIComponent(order.orderId)}`}',
              'to={`/track-order?orderId=${encodeURIComponent(displayOrderId)}`}')

          replace('src/pages/CustomerOrdersPage.tsx',
              '<b>#{order.orderId}</b>',
              '<b>#{order.orderNumber || order.orderId}</b>')

          replace('src/pages/TrackOrderPage.tsx',
              'const reference=result.kind==="order"?result.orderId:result.requestId;',
              'const reference=result.kind==="order"?String(result.orderNumber || result.orderId):result.requestId;')
          replace('src/pages/TrackOrderPage.tsx',
              'Order #{order.orderId}',
              'Order #{order.orderNumber || order.orderId}')

          p = Path('src/utils/invoicePdf.ts')
          text = p.read_text()
          text = text.replace('export type InvoiceOrder={orderId:string;', 'export type InvoiceOrder={orderId:string;orderNumber?:number;', 1)
          text = text.replace('return{orderId:order.orderId,createdAt:', 'return{orderId:order.orderId,orderNumber:"orderNumber" in order?order.orderNumber:undefined,createdAt:', 1)
          text = text.replace('["ORDER ID", clean(order.orderId)]', '["ORDER ID", clean(order.orderNumber || order.orderId)]', 1)
          text = text.replace('doc.save(`ZEVENRA-Invoice-${order.orderId}.pdf`);', 'doc.save(`ZEVENRA-Invoice-${order.orderNumber || order.orderId}.pdf`);', 1)
          p.write_text(text)

          # Regression coverage for numeric tracking and safe response shape.
          p = Path('tests/order-track.test.ts')
          text = p.read_text()
          text = text.replace('order_id: "ZEV-TEST-1", created_at:', 'order_id: "ZEV-TEST-1", order_number: 200, created_at:', 1)
          text = text.replace('"orderId","orderStatus"', '"orderId","orderNumber","orderStatus"', 1)
          anchor = 'test("a new device with empty storage tracks through the backend only", async () => {'
          insert = '''test("public numeric order number can be used for guest tracking", async () => {\n  const seen: string[] = [], handler = createOrderTrackHandler(async (orderId, phone) => { seen.push(orderId); return orderId === stored.order_id && phone === "94740529061" ? stored : null; }, undefined, async (orderNumber) => orderNumber === 200 ? stored.order_id : null), result = response();\n  await handler(request({ orderId: "#200", phone: "0740529061" }, { origin }, "198.51.102.99"), result.res);\n  assert.equal(result.state.status, 200);\n  assert.deepEqual(seen, [stored.order_id]);\n  assert.equal((result.state.body as { orderNumber: number }).orderNumber, 200);\n});\n\n'''
          if anchor not in text:
              raise SystemExit('Missing order-track test insertion anchor')
          text = text.replace(anchor, insert + anchor, 1)
          p.write_text(text)
          PY
      - name: Verify
        run: |
          npm run qa
          npm audit --omit=dev --audit-level=high
          git diff --check
      - name: Commit clean implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-public-number-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src tests
          git commit -m "Expose public product and order numbers"
          git push origin HEAD:dev-rebuild
