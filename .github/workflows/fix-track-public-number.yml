name: Fix tracking public number

on:
  push:
    branches: [dev-rebuild]
    paths:
      - '.github/workflows/fix-track-public-number.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply tracking fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'server/api-implementation/_data/orders-legacy.ts',
              '''`SELECT o.order_id,o.created_at,o.customer_name,o.address1,o.address2,o.city,o.district,o.postal_code,o.order_status,o.discount_code,o.discount_amount,\n        o.payment_method,o.payment_status,o.delivery_zone_name,o.subtotal,o.delivery_fee,o.total,''',
              '''`SELECT o.order_id,o.order_number,o.created_at,o.customer_name,o.address1,o.address2,o.city,o.district,o.postal_code,o.order_status,o.discount_code,o.discount_amount,\n        o.payment_method,o.payment_status,o.fulfillment_method,o.delivery_method_name,o.delivery_area_group_name,o.pickup_branch_name,o.pickup_branch_address,o.pickup_instructions,o.delivery_zone_name,o.subtotal,o.delivery_fee,o.total,'''
          )

          replace_once(
              'src/pages/TrackOrderPage.tsx',
              '''      setOrder(result); const reference=result.kind===\"order\"?String(result.orderNumber || result.orderId):result.requestId;setOrderId(reference);\n      setRecent(rememberGuestOrder({ orderId: reference, createdAt: result.createdAt }));''',
              '''      setOrder(result); const reference=result.kind===\"order\"?String(result.orderNumber || result.orderId):result.requestId;setOrderId(reference);\n      if(result.kind===\"order\"&&result.orderNumber&&result.orderId!==reference)removeRecentGuestOrder(result.orderId);\n      setRecent(rememberGuestOrder({ orderId: reference, createdAt: result.createdAt }));'''
          )

          replace_once(
              'src/pages/TrackOrderPage.tsx',
              '''    address = deliveryAddressLines(order);''',
              '''    address = deliveryAddressLines(order),\n    paymentLabel = order.paymentMethod === \"cod\" ? (order.fulfillmentMethod === \"pickup\" ? \"Pay at pickup\" : \"Cash on delivery\") : (order.paymentStatus || \"Bank transfer\");'''
          )

          replace_once(
              'src/pages/TrackOrderPage.tsx',
              '''<span>Payment: <b>{order.paymentStatus}</b></span>''',
              '''<span>Payment: <b>{paymentLabel}</b></span>'''
          )

          p = Path('tests/order-track.test.ts')
          s = p.read_text()
          anchor = '''test(\"checkout uses public order numbers and pickup-safe payment copy\", async () => {'''
          if anchor not in s:
              raise SystemExit('order-track regression test anchor missing')
          if 'guest tracking query returns public order and fulfillment fields' not in s:
              s += '''\n\ntest(\"guest tracking query returns public order and fulfillment fields\", async () => {\n  const source = await readFile(new URL(\"../server/api-implementation/_data/orders-legacy.ts\", import.meta.url), \"utf8\");\n  const tracking = await readFile(new URL(\"../src/pages/TrackOrderPage.tsx\", import.meta.url), \"utf8\");\n  assert.match(source, /SELECT o\\.order_id,o\\.order_number,o\\.created_at/);\n  assert.match(source, /o\\.fulfillment_method,o\\.delivery_method_name,o\\.delivery_area_group_name,o\\.pickup_branch_name/);\n  assert.match(tracking, /removeRecentGuestOrder\\(result\\.orderId\\)/);\n  assert.match(tracking, /Pay at pickup/);\n});\n'''
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm run test:order-track
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
      - name: Commit clean fixes
        run: |
          rm .github/workflows/fix-track-public-number.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep public order numbers in guest tracking'
          git push origin HEAD:dev-rebuild
