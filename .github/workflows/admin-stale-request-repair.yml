name: One-time admin stale request repair

on:
  push:
    branches:
      - dev-rebuild
    paths:
      - .github/workflows/admin-stale-request-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - name: Cancel stale admin bootstrap requests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          store_path = Path('src/features/store/StoreContext.tsx')
          source = store_path.read_text()

          old = '    timers = useRef<Record<string, ReturnType<typeof setTimeout>>>({});'
          new = '    timers = useRef<Record<string, ReturnType<typeof setTimeout>>>({}),\n    adminLoadController = useRef<AbortController | null>(null);'
          if old not in source:
              raise SystemExit('timers ref pattern not found')
          source = source.replace(old, new, 1)

          old = '''  useEffect(() => {\n    const pending = timers.current;\n    void loadPublic();\n    return () => Object.values(pending).forEach(clearTimeout);\n  }, [loadPublic]);'''
          new = '''  useEffect(() => {\n    const pending = timers.current;\n    void loadPublic();\n    return () => {\n      Object.values(pending).forEach(clearTimeout);\n      const activeAdminLoad = adminLoadController.current;\n      adminLoadController.current = null;\n      activeAdminLoad?.abort();\n    };\n  }, [loadPublic]);'''
          if old not in source:
              raise SystemExit('provider cleanup pattern not found')
          source = source.replace(old, new, 1)

          old = '''  const loadAdmin = useCallback(async (section = location.pathname) => {\n    if (demo) return;\n    setAdminLoading(true);\n    setAdminError(\"\");\n    try {\n      const payload = await adminApi.get<AdminBootstrap>(\"bootstrap\", { section });'''
          new = '''  const loadAdmin = useCallback(async (section = location.pathname) => {\n    if (demo) return;\n    const previousAdminLoad = adminLoadController.current;\n    adminLoadController.current = null;\n    previousAdminLoad?.abort();\n    const controller = new AbortController();\n    adminLoadController.current = controller;\n    setAdminLoading(true);\n    setAdminError(\"\");\n    try {\n      const payload = await adminApi.get<AdminBootstrap>(\"bootstrap\", { section }, controller.signal);'''
          if old not in source:
              raise SystemExit('loadAdmin start pattern not found')
          source = source.replace(old, new, 1)

          old = '''    } catch (reason) {\n      setAdminError(message(reason));\n    } finally {\n      setAdminLoading(false);\n    }'''
          new = '''    } catch (reason) {\n      if (controller.signal.aborted) return;\n      setAdminError(message(reason));\n    } finally {\n      if (adminLoadController.current === controller) {\n        adminLoadController.current = null;\n        setAdminLoading(false);\n      }\n    }'''
          if old not in source:
              raise SystemExit('loadAdmin catch/finally pattern not found')
          source = source.replace(old, new, 1)
          store_path.write_text(source)

          test_path = Path('tests/order-workflow.test.ts')
          tests = test_path.read_text()
          marker = 'admin section loads cancel stale bootstrap requests'
          if marker not in tests:
              tests += '''\n\ntest(\"admin section loads cancel stale bootstrap requests\",async()=>{\n  const store=await readFile(new URL(\"../src/features/store/StoreContext.tsx\",import.meta.url),\"utf8\");\n  assert.match(store,/adminLoadController = useRef<AbortController \\| null>\\(null\\)/);\n  assert.match(store,/previousAdminLoad\\?\\.abort\\(\\)/);\n  assert.match(store,/adminApi\\.get<AdminBootstrap>\\(\"bootstrap\", \\{ section \\}, controller\\.signal\\)/);\n  assert.match(store,/if \\(controller\\.signal\\.aborted\\) return/);\n});\n'''
          test_path.write_text(tests)

          Path('.github/workflows/admin-stale-request-repair.yml').unlink()
          PY
      - name: Install exact dependencies
        run: npm ci
      - name: Full QA
        run: npm run qa
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/store/StoreContext.tsx tests/order-workflow.test.ts .github/workflows/admin-stale-request-repair.yml
          git diff --cached --check
          git commit -m 'perf: cancel stale admin bootstrap requests'
          git push origin HEAD:dev-rebuild
