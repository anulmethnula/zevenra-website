name: Fix preorder cancellation flow

on:
  push:
    branches:
      - dev-rebuild
    paths:
      - '.github/workflows/fix-preorder-cancel-flow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python scripts/fix-preorder-cancel-flow.py
      - run: npm run qa
      - name: Commit fix
        run: |
          git config user.name "Anul Methnula"
          git config user.email "299733619+anulmethnula@users.noreply.github.com"
          git add -A
          git commit -m "fix: make order and preorder cancellation explicit"
          git push origin dev-rebuild
