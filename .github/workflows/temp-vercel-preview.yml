name: Temporary Vercel Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [dev-rebuild]

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_SUJ3zmeBM41qqimvqCZc6O74
      VERCEL_PROJECT_ID: prj_LuqwHdq5VSbWZ81thh1PaKu2xrAl
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check preview deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Link exact Vercel project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_SUJ3zmeBM41qqimvqCZc6O74","projectId":"prj_LuqwHdq5VSbWZ81thh1PaKu2xrAl"}' > .vercel/project.json

      - name: Deploy dev-rebuild as Preview only
        run: |
          npx --yes vercel@latest deploy --yes --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" | tee /tmp/vercel-preview-url.txt
          echo "### Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 /tmp/vercel-preview-url.txt >> "$GITHUB_STEP_SUMMARY"
