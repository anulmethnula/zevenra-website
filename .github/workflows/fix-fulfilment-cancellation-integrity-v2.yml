name: Fix fulfilment integrity v2

on:
  push:
    branches:
      - dev-rebuild
    paths:
      - .github/workflows/fix-fulfilment-cancellation-integrity-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch
        run: |
          python .github/scripts/fix_integrity.py
          python .github/scripts/fix_integrity_followup.py
      - name: Install dependencies
        run: npm ci
      - name: Full QA
        run: npm run qa
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/api-implementation/_data/orders-legacy.ts server/api-implementation/_data/order-cancellation.ts server/api-implementation/_data/preorders.ts server/api-implementation/_data/customers.ts server/api-implementation/_data/mappers.ts src/types/index.ts src/pages/admin/AdminPage.tsx src/pages/CustomerOrdersPage.tsx database/migrations/033_fulfilment_cancellation_integrity.sql tests/order-workflow.test.ts tests/preorder-lifecycle.test.ts
          git diff --cached --check
          git commit -m 'fix: harden courier and cancellation flows'
          git push origin HEAD:dev-rebuild
