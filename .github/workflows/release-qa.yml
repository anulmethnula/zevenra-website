name: Release QA

on:
  push:
    branches: [main, dev-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Application QA
        run: npm run qa

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Database tooling syntax
        run: |
          node --check scripts/db-migrate.mjs
          node --check scripts/db-verify.mjs

      - name: Required release assets
        run: |
          test -s public/media/hero-final-v2.mp4
          test -s public/brand/logo.svg
          test -s public/brand/logo-light.svg
          test -s public/brand/zevenraname.png
          test -s public/brand/about-hero.webp
          test -s public/brand/about-story.webp
          test -s public/brand/og-image.jpg
          test ! -d functions/api
