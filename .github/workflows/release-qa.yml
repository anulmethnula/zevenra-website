name: Release QA

on:
  push:
    branches: [main, dev-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zevenra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zevenra_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Application QA
        run: npm run qa

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Database tooling and migration integrity
        run: |
          node --check scripts/db-migrate.mjs
          node --check scripts/db-verify.mjs
          for file in database/migrations/*.sql; do
            version="$(basename "$file" .sql)"
            if ! grep -Fq "'$version'" "$file"; then
              echo "Migration $file does not record schema_migrations version $version"
              exit 1
            fi
          done

      - name: Apply migrations to clean PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d zevenra_ci -f "$file"
          done
          expected="$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          applied="$(psql -At -h 127.0.0.1 -U postgres -d zevenra_ci -c 'SELECT count(*) FROM schema_migrations')"
          test "$applied" = "$expected"

      - name: Required release assets
        run: |
          test -s public/media/hero-final-v2.mp4
          test -s public/brand/logo.svg
          test -s public/brand/logo-light.svg
          test -s public/brand/zevenraname.png
          test -s public/brand/about-hero.webp
          test -s public/brand/about-story.webp
          test -s public/brand/og-image.jpg
          test ! -d functions/api
