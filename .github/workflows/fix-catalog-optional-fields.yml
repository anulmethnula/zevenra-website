name: Fix catalog optional fields

on:
  push:
    branches: [dev-rebuild]
    paths:
      - .github/workflows/fix-catalog-optional-fields.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply catalog optional-field defaults
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server/api-implementation/_data/catalog.ts')
          text = path.read_text()

          marker = '''export async function saveEntity(\n  table: Entity,\n  input: Record<string, unknown>,\n) {'''
          defaults = '''const entityInputDefaults: Record<Entity, Record<string, unknown>> = {\n  categories: {\n    description: "",\n    imageUrl: "",\n    mobileImageUrl: "",\n    videoUrl: "",\n    active: true,\n    featured: false,\n    showInNavigation: false,\n    showOnHomepage: false,\n    sortOrder: 0,\n  },\n  collections: {\n    description: "",\n    heroImage: "",\n    mobileImage: "",\n    videoUrl: "",\n    ctaLabel: "",\n    active: true,\n    showInNavigation: false,\n    showOnHomepage: false,\n    sortOrder: 0,\n  },\n  size_charts: {\n    unit: "cm",\n    columns: [],\n    rows: [],\n    notes: "",\n    imageUrl: "",\n  },\n  navigation: { visible: true, sortOrder: 0 },\n  homepage_sections: {},\n};\n\nexport async function saveEntity(\n  table: Entity,\n  input: Record<string, unknown>,\n) {'''
          if text.count(marker) != 1:
              raise SystemExit(f'saveEntity marker expected once, found {text.count(marker)}')
          text = text.replace(marker, defaults, 1)

          old = '''      const value = input[key];\n      return ["columns", "rows"].includes(key)\n        ? JSON.stringify(value || [])\n        : (value ?? null);'''
          new = '''      const value = input[key] ?? entityInputDefaults[table][key];\n      return ["columns", "rows"].includes(key)\n        ? JSON.stringify(value ?? [])\n        : (value ?? null);'''
          if text.count(old) != 1:
              raise SystemExit(f'value normalization block expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run QA
        run: npm run qa

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-catalog-optional-fields.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow optional catalog fields to be blank"
          git push origin HEAD:dev-rebuild
