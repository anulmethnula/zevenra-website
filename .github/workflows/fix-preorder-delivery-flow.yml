name: Fix preorder delivery flow

on:
  push:
    branches:
      - dev-rebuild
    paths:
      - .github/workflows/fix-preorder-delivery-flow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply repair
        run: python .github/scripts/fix_preorder_delivery_flow.py
      - name: Install dependencies
        run: npm ci
      - name: Full QA
        run: npm run qa
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/api-implementation/_data/preorders.ts server/api-implementation/_shared.ts src/pages/PreorderCompletePage.tsx src/pages/admin/AdminPage.tsx database/migrations/034_order_financial_fulfilment_integrity.sql tests/preorder-lifecycle.test.ts tests/order-workflow.test.ts
          git diff --cached --check
          git commit -m 'fix: repair preorder delivery and collection flow'
          git push origin HEAD:dev-rebuild
