name: Temporary Typecheck
on:
  pull_request:
    branches:
      - main
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check Apps Script syntax
        run: cp apps-script/Code.gs /tmp/zevenra-code.js && node --check /tmp/zevenra-code.js
