name: Fix simple order admin

on:
  push:
    branches: [dev-rebuild]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Simplify order admin and remove duplicate requests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, name, count=1):
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{name}: expected {count} match(es), found {found}")
              return text.replace(old, new, count)

          # Human-facing label: confirmed is the processing stage.
          p = Path('shared/order-status.ts')
          s = p.read_text()
          s = must_replace(s,
          '''export function orderStatusLabel(value: unknown) {
            const status = normalizeOrderStatus(value);
            return status.charAt(0).toUpperCase() + status.slice(1);
          }''',
          '''export function orderStatusLabel(value: unknown) {
            const status = normalizeOrderStatus(value);
            if (status === "confirmed") return "Processing";
            return status.charAt(0).toUpperCase() + status.slice(1);
          }''',
          'order status label')
          p.write_text(s)

          # Pre-order delivery orders can also use the same Processing stage.
          p = Path('server/api-implementation/_data/orders-legacy.ts')
          s = p.read_text()
          s = must_replace(s,
          '''      transitions: Record<string, string[]> = preorderOrder ? {
                  pending: ["dispatched", "cancelled"],
                  dispatched: ["delivered"],
                  delivered: [],
                  cancelled: ["pending","confirmed"],
                } : {''',
          '''      transitions: Record<string, string[]> = preorderOrder ? {
                  pending: ["confirmed", "dispatched", "cancelled"],
                  confirmed: ["dispatched", "cancelled"],
                  dispatched: ["delivered"],
                  delivered: [],
                  cancelled: ["pending","confirmed"],
                } : {''',
          'preorder order transitions')
          p.write_text(s)

          p = Path('src/pages/admin/AdminPage.tsx')
          s = p.read_text()

          # Use the already-loaded full order instead of another GET when opening a drawer.
          s = must_replace(s,
          '''    if (details[orderId]) return;
              setLoadingId(orderId);''',
          '''    if (details[orderId]) return;
              const cached = admin.orders.find((item) => item.orderId === orderId);
              if (cached) {
                setDetails((current) => ({ ...current, [orderId]: cached as AdminOrderDetail }));
                return;
              }
              setLoadingId(orderId);''',
          'cached order drawer')

          # updateOrder already returns the updated full order. Do not POST and then GET it again.
          s = must_replace(s,
          '''    try {
                await updateOrder({ orderId, ...patch });
                const updated = await adminApi.get<AdminOrderDetail>("getOrder", { orderId });
                setDetails((current) => ({
                  ...current,
                  [orderId]: {
                    ...(current[orderId] || {}),
                    ...updated,
                  } as AdminOrderDetail,
                }));''',
          '''    try {
                const updated = await updateOrder({ orderId, ...patch });
                setDetails((current) => ({
                  ...current,
                  [orderId]: {
                    ...(current[orderId] || {}),
                    ...updated,
                  } as AdminOrderDetail,
                }));''',
          'single order update request')

          # Conversion already redirects to a fresh Orders page; avoid a full admin bootstrap before the redirect.
          s = must_replace(s,
          '''      await store.loadAdmin();
                setOpen("");
                const publicOrderNumber = String(order.orderNumber || order.orderId);''',
          '''      setOpen("");
                const publicOrderNumber = String(order.orderNumber || order.orderId);''',
          'preorder conversion reload')

          # Replace the two large status dropdowns with a simple forward workflow.
          pattern = re.compile(r'''<Panel title="Order control">\s*<label className="mb-3 block text-xs">[\s\S]*?</label>\s*\{detail\.paymentMethod==="bank"\?<label className="block text-xs">[\s\S]*?</label>:<Info label="Payment method" value="Cash on delivery"/>\}\s*(?=\{dispatchOrderId===order\.orderId\?)''')
          replacement = '''<Panel title="Order control">
                            <div className="grid gap-3">
                              <div className="flex items-center justify-between gap-3 border-b border-black/10 pb-3 text-xs">
                                <span className="text-black/55">Order status</span>
                                <b>{orderStatusLabel(normalizedOrderStatus)}</b>
                              </div>
                              {normalizedOrderStatus === "pending" && (
                                <button type="button" className="btn btn-dark w-full justify-center" disabled={savingId === order.orderId} onClick={() => void change(order.orderId,{orderStatus:"confirmed"})}>
                                  {savingId===order.orderId?"Updating…":"Start processing"}
                                </button>
                              )}
                              {normalizedOrderStatus === "confirmed" && (
                                <button type="button" className="btn btn-dark w-full justify-center" disabled={savingId === order.orderId} onClick={() => { const existingId=detail.fulfilmentCourierId||""; setDispatchOrderId(order.orderId); setDispatchCourierId(selectDispatchCourierId(admin.fulfilmentCouriers,existingId)); setDispatchTrackingNumber(detail.trackingNumber||""); setDispatchTrackingUrl(detail.trackingUrl||""); setDispatchHandover(sriLankaDateTimeLocal()); }}>
                                  Dispatch order
                                </button>
                              )}
                              {normalizedOrderStatus === "dispatched" && (
                                <button type="button" className="btn btn-dark w-full justify-center" disabled={savingId === order.orderId} onClick={() => { if(window.confirm("Mark this order as delivered?")) void change(order.orderId,{orderStatus:"delivered"}); }}>
                                  {savingId===order.orderId?"Updating…":"Mark delivered"}
                                </button>
                              )}
                              {normalizedOrderStatus === "delivered" && <p className="text-xs leading-5 text-black/50">Delivered. Use Return below only if the customer sends an item back.</p>}
                              {normalizedOrderStatus === "cancelled" && <p className="text-xs leading-5 text-black/50">This order is cancelled.</p>}
                            </div>
                            '''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'order control replacement: expected 1 match, found {n}')

          # Receipt verification gets only the two decisions the owner needs.
          pattern = re.compile(r'''<Info\s+label="Payment status"\s+value=\{detail\.paymentStatus\}\s*/>\s*\{detail\.paymentReceiptUrl && \(\s*<ProtectedReceipt\s+url=\{detail\.paymentReceiptUrl\}\s*/>\s*\)\}\{" "\}''')
          replacement = '''<Info label="Payment status" value={detail.paymentStatus} />
                              {detail.paymentReceiptUrl && <ProtectedReceipt url={detail.paymentReceiptUrl} />}
                              {detail.paymentMethod === "bank" && !detail.sourcePreorderRequestId && detail.paymentReceiptUrl && (
                                <label className="block text-xs">
                                  Receipt decision
                                  <select
                                    className="field mt-2"
                                    disabled={savingId === order.orderId}
                                    value={["verified","paid"].includes(String(detail.paymentStatus||"").toLowerCase()) ? "verified" : String(detail.paymentStatus||"").toLowerCase() === "rejected" ? "rejected" : ""}
                                    onChange={(event) => { const value=event.target.value; if(value) void change(order.orderId,{paymentStatus:value}); }}
                                  >
                                    <option value="">Choose decision</option>
                                    <option value="verified">Verified</option>
                                    <option value="rejected">Rejected</option>
                                  </select>
                                </label>
                              )}'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'receipt decision replacement: expected 1 match, found {n}')

          s = must_replace(s,
          '''<span className="admin-status">{order.orderStatus}</span>''',
          '''<span className="admin-status">{orderStatusLabel(order.orderStatus)}</span>''',
          'drawer order status label')

          # Returns are loaded only when the owner opens the Return section.
          s = must_replace(s,
          '''  const [returns, setReturns] = useState<AdminReturn[]>([]), [loading, setLoading] = useState(false), [creating, setCreating] = useState(false);
            const eligible = order.orderStatus === "dispatched" || order.orderStatus === "delivered";
            const load = useCallback(async () => { setLoading(true); try { setReturns(await adminApi.get<AdminReturn[]>("listReturns", { orderId: order.orderId })); } catch (reason) { onMessage(reason instanceof Error ? reason.message : "Could not load returns."); } finally { setLoading(false); } }, [onMessage, order.orderId]);
            useEffect(() => { void load(); }, [load]);''',
          '''  const [returns, setReturns] = useState<AdminReturn[]>([]), [loading, setLoading] = useState(false), [creating, setCreating] = useState(false), [expanded, setExpanded] = useState(false);
            const eligible = order.orderStatus === "dispatched" || order.orderStatus === "delivered";
            const load = useCallback(async () => { setLoading(true); try { setReturns(await adminApi.get<AdminReturn[]>("listReturns", { orderId: order.orderId })); } catch (reason) { onMessage(reason instanceof Error ? reason.message : "Could not load returns."); } finally { setLoading(false); } }, [onMessage, order.orderId]);
            useEffect(() => { if (expanded) void load(); }, [expanded, load]);
            if (!eligible && !Number(order.returnCount)) return null;
            if (!expanded) return <Panel title="Return"><button type="button" className="btn w-full justify-center" onClick={() => setExpanded(true)}>{Number(order.returnCount) ? "View return" : "Create return"}</button></Panel>;''',
          'lazy return panel')
          s = must_replace(s, 'return <Panel title="Returns">', 'return <Panel title="Return">', 'return panel title')

          p.write_text(s)

          # Update the source-based UI test to match the simplified flow and performance fix.
          p = Path('tests/order-workflow.test.ts')
          s = p.read_text()
          old = '''test("admin status UI blocks duplicates, restores server state, and captures dispatch details",async()=>{
            const source=await readFile(new URL("../src/pages/admin/AdminPage.tsx",import.meta.url),"utf8");
            assert.match(source,/updateInFlight\\.current\\.has\\(orderId\\)/);
            assert.match(source,/finally[\\s\\S]*updateInFlight\\.current\\.delete\\(orderId\\)/);
            assert.match(source,/adminApi\\.get<AdminOrderDetail>\\("getOrder"/);
            assert.match(source,/fulfilmentCourierId:dispatchCourierId/);
            assert.doesNotMatch(source,/fulfilmentCourierProviderId:dispatchCourierId/);
            assert.match(source,/courierSentDate:sriLankaDateTimeToIso\\(dispatchHandover\\)/);
            assert.match(source,/Tracking number \\(optional\\)/);
            assert.match(source,/Tracking URL \\(optional\\)/);
            assert.match(source,/CONFIRM HANDOVER/);
            assert.match(source,/value=\\{normalizedOrderStatus\\}/);
            assert.match(source,/onClick=\\{\\(\\)=>setDispatchOrderId\\(""\\)\\}/);
          });'''
          new = '''test("admin order UI uses a simple forward flow and avoids duplicate refreshes",async()=>{
            const source=await readFile(new URL("../src/pages/admin/AdminPage.tsx",import.meta.url),"utf8");
            assert.match(source,/updateInFlight\\.current\\.has\\(orderId\\)/);
            assert.match(source,/finally[\\s\\S]*updateInFlight\\.current\\.delete\\(orderId\\)/);
            assert.match(source,/const updated = await updateOrder\\(\\{ orderId, \.\.\.patch \\}\\)/);
            assert.match(source,/const cached = admin\\.orders\\.find/);
            assert.match(source,/Start processing/);
            assert.match(source,/Dispatch order/);
            assert.match(source,/Mark delivered/);
            assert.match(source,/Receipt decision/);
            assert.match(source,/<option value="verified">Verified<\\/option>/);
            assert.match(source,/<option value="rejected">Rejected<\\/option>/);
            assert.doesNotMatch(source,/Payment status[\\s\\S]{0,500}refund pending/);
            assert.match(source,/fulfilmentCourierId:dispatchCourierId/);
            assert.doesNotMatch(source,/fulfilmentCourierProviderId:dispatchCourierId/);
            assert.match(source,/courierSentDate:sriLankaDateTimeToIso\\(dispatchHandover\\)/);
            assert.match(source,/CONFIRM HANDOVER/);
            assert.match(source,/if \\(expanded\\) void load\\(\\)/);
          });'''
          s = must_replace(s, old, new, 'order workflow test')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run QA
        run: npm run qa
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-simple-order-admin.yml
          git add src/pages/admin/AdminPage.tsx shared/order-status.ts server/api-implementation/_data/orders-legacy.ts tests/order-workflow.test.ts
          git commit -m "fix: simplify and speed up order admin"
          git push origin HEAD:dev-rebuild
