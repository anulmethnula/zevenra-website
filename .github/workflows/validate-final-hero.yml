name: Validate final hero video
on:
  push:
    branches:
      - fix/final-hero-video
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hero video
        run: |
          file public/media/hero-final-v2.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate -of default=noprint_wrappers=1 public/media/hero-final-v2.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/media/hero-final-v2.mp4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
