name: Temporary Order Flow Hotfix

on:
  push:
    branches: [dev-rebuild]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply order workflow hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('server/api-implementation/_data/orders-legacy.ts')
          s = backend.read_text()

          old = '''    const storedStatus = String(current.order_status),
              currentStatus = normalizeAdminOrderStatus(storedStatus),
              nextStatus = String(input.orderStatus ?? currentStatus).toLowerCase(),
              preorderOrder = Boolean(current.source_preorder_request_id),
              transitions: Record<string, string[]> = preorderOrder ? {'''
          new = '''    const storedStatus = String(current.order_status),
              currentStatus = normalizeAdminOrderStatus(storedStatus),
              preorderOrder = Boolean(current.source_preorder_request_id),
              nextPayment = String(input.paymentStatus ?? current.payment_status),
              rejectingBankPayment = current.payment_method === "bank" && input.paymentStatus !== undefined && nextPayment.toLowerCase() === "rejected",
              requestedStatus = String(input.orderStatus ?? currentStatus).toLowerCase(),
              paymentRollback = rejectingBankPayment && currentStatus === "confirmed" && input.orderStatus === undefined,
              nextStatus = paymentRollback ? "pending" : requestedStatus,
              transitions: Record<string, string[]> = preorderOrder ? {'''
          if old not in s:
              raise SystemExit('backend status declaration pattern not found')
          s = s.replace(old, new, 1)

          old = '''    if (nextStatus !== currentStatus && !transitions[currentStatus]?.includes(nextStatus))
              throw new Error(`Order cannot move from ${currentStatus} to ${nextStatus}.`);
            const nextPayment = String(input.paymentStatus ?? current.payment_status),
              bankReady = ["paid", "verified"].includes(nextPayment.toLowerCase());'''
          new = '''    if (nextStatus !== currentStatus && !transitions[currentStatus]?.includes(nextStatus) && !paymentRollback)
              throw new Error(`Order cannot move from ${currentStatus} to ${nextStatus}.`);
            const bankReady = ["paid", "verified"].includes(nextPayment.toLowerCase());'''
          if old not in s:
              raise SystemExit('backend transition/payment pattern not found')
          s = s.replace(old, new, 1)

          old = '''    if (current.payment_method === "bank" && nextStatus === "confirmed" && !bankReady)
              throw new Error("Verify or mark the bank payment paid before confirming this order.");'''
          new = '''    if (current.payment_method === "bank" && ["confirmed", "dispatched", "delivered"].includes(nextStatus) && !bankReady)
              throw new Error("Verify or mark the bank payment paid before processing this order.");'''
          if old not in s:
              raise SystemExit('backend bank readiness pattern not found')
          s = s.replace(old, new, 1)

          old = '''    for (const key of fields)
              if (input[key] !== undefined) {
                values.push(input[key] || null);
                updates.push(`${map[key]}=$${values.length}`);
              }'''
          new = '''    for (const key of fields)
              if (input[key] !== undefined) {
                const value = key === "trackingNumber" || key === "trackingUrl"
                  ? String(input[key] ?? "").trim()
                  : key === "fulfilmentCourierId"
                    ? String(input[key] ?? "").trim() || null
                    : input[key] || null;
                values.push(value);
                updates.push(`${map[key]}=$${values.length}`);
              }'''
          if old not in s:
              raise SystemExit('backend optional tracking pattern not found')
          s = s.replace(old, new, 1)
          backend.write_text(s)

          ui = Path('src/pages/admin/AdminPage.tsx')
          s = ui.read_text()

          old = '''              additionalItems = Math.max(0, (order.items?.length || 0) - 1),
              normalizedOrderStatus = normalizeOrderStatus(detail?.orderStatus||order.orderStatus);'''
          new = '''              additionalItems = Math.max(0, (order.items?.length || 0) - 1),
              normalizedOrderStatus = normalizeOrderStatus(detail?.orderStatus||order.orderStatus),
              paymentState = String(detail?.paymentStatus||order.paymentStatus||"").toLowerCase(),
              bankPaymentReady = detail?.paymentMethod !== "bank" || ["verified","paid"].includes(paymentState);'''
          if old not in s:
              raise SystemExit('UI order state pattern not found')
          s = s.replace(old, new, 1)

          old = '''                    {normalizedOrderStatus === "pending" && (
                      <button type="button" className="btn btn-dark w-full justify-center" disabled={savingId === order.orderId} onClick={() => void change(order.orderId,{orderStatus:"confirmed"})}>
                        {savingId===order.orderId?"Updating…":"Start processing"}
                      </button>
                    )}'''
          new = '''                    {normalizedOrderStatus === "pending" && !bankPaymentReady && (
                      <p className="rounded-xl border border-amber-900/15 bg-amber-50/70 p-3 text-xs leading-5 text-amber-950">{paymentState === "rejected" ? "Receipt rejected. Processing is locked until the payment is verified." : "Verify the bank receipt before processing this order."}</p>
                    )}
                    {normalizedOrderStatus === "pending" && (
                      <button type="button" className="btn btn-dark w-full justify-center" disabled={savingId === order.orderId || !bankPaymentReady} onClick={() => void change(order.orderId,{orderStatus:"confirmed"})}>
                        {savingId===order.orderId?"Updating…":"Start processing"}
                      </button>
                    )}'''
          if old not in s:
              raise SystemExit('UI pending control pattern not found')
          s = s.replace(old, new, 1)

          old = '''                      <button type="button" className="btn btn-dark w-full justify-center" disabled={savingId === order.orderId} onClick={() => { const existingId=detail.fulfilmentCourierId||""; setDispatchOrderId(order.orderId); setDispatchCourierId(selectDispatchCourierId(admin.fulfilmentCouriers,existingId)); setDispatchTrackingNumber(detail.trackingNumber||""); setDispatchTrackingUrl(detail.trackingUrl||""); setDispatchHandover(sriLankaDateTimeLocal()); }}>'''
          new = '''                      <button type="button" className="btn btn-dark w-full justify-center" disabled={savingId === order.orderId || !bankPaymentReady} onClick={() => { const existingId=detail.fulfilmentCourierId||""; setDispatchOrderId(order.orderId); setDispatchCourierId(selectDispatchCourierId(admin.fulfilmentCouriers,existingId)); setDispatchTrackingNumber(detail.trackingNumber||""); setDispatchTrackingUrl(detail.trackingUrl||""); setDispatchHandover(sriLankaDateTimeLocal()); }}>'''
          if old not in s:
              raise SystemExit('UI dispatch control pattern not found')
          s = s.replace(old, new, 1)

          old = '''                          disabled={savingId === order.orderId}
                          value={["verified","paid"].includes(String(detail.paymentStatus||"").toLowerCase()) ? "verified" : String(detail.paymentStatus||"").toLowerCase() === "rejected" ? "rejected" : ""}
                          onChange={(event) => { const value=event.target.value; if(value) void change(order.orderId,{paymentStatus:value}); }}'''
          new = '''                          disabled={savingId === order.orderId || ["dispatched","delivered","cancelled"].includes(normalizedOrderStatus)}
                          value={["verified","paid"].includes(String(detail.paymentStatus||"").toLowerCase()) ? "verified" : String(detail.paymentStatus||"").toLowerCase() === "rejected" ? "rejected" : ""}
                          onChange={(event) => { const value=event.target.value; if(!value)return; if(value==="rejected"&&normalizedOrderStatus==="confirmed"&&!window.confirm("Rejecting this receipt will move the order back to Pending and stop processing. Continue?")){event.currentTarget.value="verified";return;} void change(order.orderId,{paymentStatus:value}); }}'''
          if old not in s:
              raise SystemExit('UI receipt decision pattern not found')
          s = s.replace(old, new, 1)
          ui.write_text(s)

          tests = Path('tests/order-workflow.test.ts')
          s = tests.read_text()
          marker = '''test("delivery cleanup creates an empty actual-courier registry and drops the legacy model",async()=>{'''
          addition = '''test("dispatch keeps optional tracking fields empty instead of writing database nulls",async()=>{
            const source=await readFile(new URL("../server/api-implementation/_data/orders-legacy.ts",import.meta.url),"utf8");
            assert.match(source,/key === "trackingNumber" \\|\\| key === "trackingUrl"/);
            assert.match(source,/String\\(input\\[key\\] \\?\\? ""\\)\\.trim\\(\\)/);
          });

          test("rejected bank receipts cannot continue fulfilment and processing rolls back safely",async()=>{
            const backend=await readFile(new URL("../server/api-implementation/_data/orders-legacy.ts",import.meta.url),"utf8");
            const ui=await readFile(new URL("../src/pages/admin/AdminPage.tsx",import.meta.url),"utf8");
            assert.match(backend,/paymentRollback = rejectingBankPayment && currentStatus === "confirmed"/);
            assert.match(backend,/\\["confirmed", "dispatched", "delivered"\\]\\.includes\\(nextStatus\\) && !bankReady/);
            assert.match(ui,/bankPaymentReady/);
            assert.match(ui,/Receipt rejected\\. Processing is locked until the payment is verified\\./);
          });

          '''
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          s = s.replace(marker, addition + marker, 1)
          tests.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run full QA
        run: npm run qa

      - name: Commit hotfix and remove temporary workflow
        run: |
          rm .github/workflows/temp-order-flow-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce bank receipt and dispatch flow"
          git push origin dev-rebuild
