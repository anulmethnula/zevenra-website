name: Fix admin preorder flow

on:
  push:
    branches:
      - dev-rebuild
    paths:
      - .github/workflows/fix-admin-preorder-flow.yml

permissions:
  contents: write

jobs:
  patch_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-rebuild
        uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply admin preorder patch
        run: python3 .github/scripts/fix_admin_preorder_flow.py

      - name: Install dependencies
        run: npm ci

      - name: Run QA
        run: npm run qa

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-admin-preorder-flow.yml
          rm .github/scripts/fix_admin_preorder_flow.py
          git add src/pages/admin/AdminPage.tsx src/styles/index.css .github/workflows/fix-admin-preorder-flow.yml .github/scripts/fix_admin_preorder_flow.py
          git commit -m "fix: clarify preorder delivery flow and admin alignment"
          git push origin HEAD:dev-rebuild
