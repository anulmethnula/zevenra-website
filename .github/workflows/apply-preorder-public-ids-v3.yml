name: Apply preorder public IDs v3

on:
  push:
    branches: [dev-rebuild]
    paths:
      - .github/workflows/apply-preorder-public-ids-v3.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev-rebuild
        uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0

      - name: Apply fix and update QA expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-preorder-public-ids-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'preorder-public-id-fix-v2', 'exec'))

          test = Path('tests/order-track.test.ts')
          text = test.read_text()
          old = r'assert.match(tracking, /placeholder="200 or PRE-\.\.\."/);'
          new = r'assert.match(tracking, /placeholder="200 or PRE-200"/);'
          if old not in text:
              raise SystemExit('order-track placeholder assertion marker missing')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run full QA
        run: npm run qa

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "ZEVENRA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add database/migrations/032_preorder_public_numbers.sql \
            server/api-implementation/_data/mappers.ts \
            server/api-implementation/_data/preorders.ts \
            server/api-implementation/_data/customers.ts \
            server/api-implementation/account/'[action].ts' \
            server/api-implementation/order-track.ts \
            src/types/index.ts \
            src/pages/TrackOrderPage.tsx \
            src/pages/PreorderPage.tsx \
            src/pages/PreorderCompletePage.tsx \
            src/pages/CustomerOrdersPage.tsx \
            src/pages/admin/AdminPage.tsx \
            src/utils/preorderSummaryPdf.ts \
            tests/order-track.test.ts \
            tests/preorder-lifecycle.test.ts
          git diff --cached --check
          git commit -m "fix: add durable public preorder numbers"
          git push origin HEAD:dev-rebuild
