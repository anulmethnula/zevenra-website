name: Fix order lifecycle integrity

on:
  push:
    branches: [dev-rebuild]
    paths:
      - .github/workflows/fix-order-lifecycle-integrity.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch order lifecycle
        run: python3 .github/scripts/fix_order_lifecycle_integrity.py
      - name: Install exact dependencies
        run: npm ci
      - name: Full QA
        run: npm run qa
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/store/StoreContext.tsx src/pages/admin/AdminPage.tsx server/api-implementation/_data/orders-legacy.ts tests/order-workflow.test.ts
          git commit -m "fix: sync returns cancellations payments and inventory"
          git push origin HEAD:dev-rebuild
